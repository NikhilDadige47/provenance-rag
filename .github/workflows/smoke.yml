name: Production smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public origin of the deployed API + UI (https://...)
        required: true
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tier A/B/C smoke
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
          SMOKE_LLM_KEY: ${{ secrets.SMOKE_LLM_KEY }}
          SMOKE_LLM_PROVIDER: ${{ secrets.SMOKE_LLM_PROVIDER }}
          SMOKE_LLM_MODEL: ${{ secrets.SMOKE_LLM_MODEL }}
        run: python scripts/smoke_prod.py
