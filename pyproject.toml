[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-rag"
version = "0.1.0"
description = "Production-grade RAG Portfolio with 3-tier hybrid access, BYOK security, and Cohere Embed/Rerank"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Nikhil Dadige" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "pymupdf>=1.24.0",
    "qdrant-client>=1.12.0",
    "libsql>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".agents", "frontend-react"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
per-file-ignores = { "scripts/*" = ["E402"] }

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
